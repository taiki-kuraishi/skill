pre-commit:
  parallel: true
  commands:
    dprint-check:
      glob: "*.{md,toml,json,jsonc,yml,yaml}"
      run: mise exec -- dprint check --allow-no-files {staged_files}
    markdownlint:
      glob: "*.md"
      run: mise exec -- markdownlint-cli2 --no-globs {staged_files}
    markdownlint-config:
      glob: "{.markdownlint-cli2.yaml,dprint.json,mise.toml,mise.lock}"
      run: mise exec -- markdownlint-cli2
    lefthook-validate:
      glob: "{lefthook.yml,mise.toml,mise.lock}"
      run: mise exec -- lefthook validate
    renovate-validate:
      glob: "{renovate.json,mise.toml,mise.lock}"
      run: mise exec -- renovate-config-validator --strict renovate.json
    vp-lint:
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: mise exec -- bun vp run lint
    vp-fmt-check:
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: mise exec -- bun vp run fmt-check
    vp-type-check:
      glob: "{*.{ts,tsx},tsconfig.json,package.json,bun.lock}"
      run: mise exec -- bun vp run type-check
