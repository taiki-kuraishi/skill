[settings]
lockfile = true

[settings.npm]
package_manager = "bun"

[tools]
bun = "1.4.2"
dprint = "0.63.0"
lefthook = "2.2.1"
node = "24.21.0"
"npm:markdownlint-cli2" = "0.23.3"
"npm:renovate" = "44.164.7"

[tasks.install]
run = [
  "mise trust --all",
  "mise install --locked",
  "bun install --frozen-lockfile",
  "lefthook install",
]

[tasks.format]
run = ["dprint fmt", "bun vp run fmt"]

[tasks.lint]
run = ["markdownlint-cli2", "bun vp run lint"]

[tasks.build]
run = "bun vp run -r build"

[tasks.test]
run = "bun vp run -r test"

[tasks.check]
run = [
  "dprint check",
  "markdownlint-cli2",
  "bun vp run lint",
  "bun vp run fmt-check",
  "bun vp run type-check",
  "bun vp run -r build",
  "bun vp run -r test",
  "lefthook validate",
  "renovate-config-validator --strict renovate.json",
]
