name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dprint: ${{ steps.filter.outputs.dprint }}
      markdownlint: ${{ steps.filter.outputs.markdownlint }}
      lefthook: ${{ steps.filter.outputs.lefthook }}
      renovate: ${{ steps.filter.outputs.renovate }}
      vite-plus: ${{ steps.filter.outputs.vite-plus }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            dprint:
              - "**/*.{md,toml,json,jsonc,yml,yaml}"
              - "mise.lock"
            markdownlint:
              - "**/*.md"
              - ".markdownlint-cli2.yaml"
              - "dprint.json"
              - "mise.toml"
              - "mise.lock"
              - ".github/workflows/ci.yml"
            lefthook:
              - "lefthook.yml"
              - "mise.toml"
              - "mise.lock"
              - ".github/workflows/ci.yml"
            renovate:
              - "renovate.json"
              - "mise.toml"
              - "mise.lock"
              - ".github/workflows/ci.yml"
            vite-plus:
              - "**/*.{ts,tsx,js,mjs,cjs}"
              - "**/package.json"
              - "**/tsconfig.json"
              - "bun.lock"
              - "mise.toml"
              - "mise.lock"
              - ".github/workflows/ci.yml"
              - ".github/actions/**"

  dprint:
    needs: changes
    if: needs.changes.outputs.dprint == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.5"
          install_args: "--locked dprint"
      - run: dprint check

  markdownlint:
    needs: changes
    if: needs.changes.outputs.markdownlint == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.5"
          install_args: "--locked bun node npm:markdownlint-cli2"
      - run: markdownlint-cli2

  lefthook:
    needs: changes
    if: needs.changes.outputs.lefthook == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.5"
          install_args: "--locked lefthook"
      - run: lefthook validate

  renovate:
    needs: changes
    if: needs.changes.outputs.renovate == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.5"
          install_args: "--locked bun node npm:renovate"
      - run: renovate-config-validator --strict renovate.json

  vite-plus:
    needs: changes
    if: needs.changes.outputs.vite-plus == 'true'
    # oxlint's RuleTester reserves a 6 GiB ArrayBuffer, which fails on ubuntu-slim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: "2026.10.5"
          install_args: "--locked bun node"
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/vite-task-cache
        with:
          mode: restore
      - run: bun vp run lint
      - run: bun vp run fmt-check
      - run: bun vp run type-check
      - run: bun vp run -r build
      - run: bun vp run -r test
      - if: success()
        uses: ./.github/actions/vite-task-cache
        with:
          mode: save

  check:
    needs:
      - changes
      - dprint
      - markdownlint
      - lefthook
      - renovate
      - vite-plus
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
